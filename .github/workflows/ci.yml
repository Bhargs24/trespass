name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, strict type-check, and the full test suite across supported Pythons.
  # The differential-vs-Z3 tests run here (z3-solver is a dev dependency).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy, strict)
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Test
        run: pytest -q --cov=trespass --cov-report=term-missing

  # Dynamic validation: the solver's verdicts must match a real Postgres.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]"
      - name: Validate against real Postgres
        env:
          TRESPASS_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/test_postgres.py -v
